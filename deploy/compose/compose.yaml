name: food-delivery

# Оба каталога используют один образ, одну БД и общий Redis.
x-catalog: &catalog-service
  image: food-delivery/catalog:local
  restart: unless-stopped
  stop_grace_period: 15s
  environment:
    LOG_LEVEL: ${LOG_LEVEL:-info}
    CATALOG_REDIS_ADDR: "redis:6379"
    CATALOG_HTTP_ADDR: ":8082"
    CATALOG_GRPC_ADDR: ":9082"
    CATALOG_DATABASE_URL: "postgres://catalog_app@postgres:5432/catalog_db?sslmode=disable"
    CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?CATALOG_DB_PASSWORD is required}
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/healthcheck", "http://127.0.0.1:8082/readyz"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?CATALOG_DB_PASSWORD is required}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?ORDERS_DB_PASSWORD is required}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?NOTIFICATIONS_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Kafka хранит события заказов и передаёт их потребителям.
  kafka:
    image: apache/kafka:4.1.2
    restart: unless-stopped
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      # Один узел совмещает брокер и контроллер KRaft.
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # Отдельные адреса для контейнеров, локальных приложений и контроллера.
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Служебные топики используют одну реплику на локальном брокере.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    # Готовность проверяется запросом к Kafka API.
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Веб-интерфейс показывает топики, сообщения и группы потребителей.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    restart: unless-stopped
    profiles: ["ui"]
    ports: ["127.0.0.1:8083:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: "food-delivery"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy

  # Redis хранит восстанавливаемый кэш и краткоживущие счётчики.
  redis:
    # Проверенный локальный образ Redis 8.2.9 зафиксирован по digest.
    image: redis@sha256:7d1e4ce8b9395088377ab382d1f6cfdbd13b3690795198a0399ab8d683064d6d
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:16379:6379"]
    # Кэш не требует восстановления с диска после перезапуска Redis.
    tmpfs: ["/data:rw,size=16m"]
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(redis-cli --raw ping)" = PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Redis Insight получает подключение к Redis по имени сервиса Compose.
  redis-insight:
    image: redis/redisinsight@sha256:b5e19ee240abef6edb435871b90ff8a210995422e8e018ab61c0339d318a1f84
    restart: unless-stopped
    profiles: ["ui"]
    ports: ["127.0.0.1:5540:5540"]
    environment:
      RI_REDIS_HOST: "redis"
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: "food-delivery"
    volumes:
      - redis_insight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');const r=h.get('http://127.0.0.1:5540/api/health/',s=>{s.resume();process.exit(s.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(2000,()=>{r.destroy();process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Собирает метрики сервисов, обоих каталогов и балансировщика.
  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    profiles: ["monitoring"]
    ports: ["127.0.0.1:9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Проверяет готовность Prometheus принимать запросы.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Показывает метрики проекта на подготовленном dashboard.
  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    profiles: ["monitoring"]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    # Проверяет готовность Grafana и её внутренней БД.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Сохраняем прежние имя и порты первого каталога.
  catalog:
    <<: *catalog-service
    build:
      context: ../../../catalog-service
    ports:
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:9082:9082"

  # Второй процесс использует тот же собранный образ каталога.
  catalog-2:
    <<: *catalog-service
    ports:
      - "127.0.0.1:8085:8082"
      - "127.0.0.1:9085:9082"

  # Общая точка входа HTTP и gRPC для двух экземпляров каталога.
  balancer:
    build:
      context: ../..
    image: food-delivery/balancer:local
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BALANCER_HTTP_ADDR: ":8084"
      BALANCER_GRPC_ADDR: ":9084"
      BALANCER_CATALOG_1_HTTP_URL: "http://catalog:8082"
      BALANCER_CATALOG_1_GRPC_ADDR: "catalog:9082"
      BALANCER_CATALOG_2_HTTP_URL: "http://catalog-2:8082"
      BALANCER_CATALOG_2_GRPC_ADDR: "catalog-2:9082"
    ports:
      - "127.0.0.1:8084:8084"
      - "127.0.0.1:9084:9084"
    # Readiness решает балансировщик; второй каталог может быть недоступен.
    depends_on:
      catalog:
        condition: service_started
      catalog-2:
        condition: service_started
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8084/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  orders:
    build:
      context: ../../../orders-service
    image: food-delivery/orders:local
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ORDERS_REDIS_ADDR: "redis:6379"
      ORDERS_HTTP_ADDR: ":8080"
      ORDERS_DATABASE_URL: "postgres://orders_app@postgres:5432/orders_db?sslmode=disable"
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?ORDERS_DB_PASSWORD is required}
      CATALOG_GRPC_ADDR: "balancer:9084"
      KAFKA_BROKERS: "kafka:9092"
      ORDER_CREATED_TOPIC: "food.order-created.v1"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      balancer:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  notifications:
    build:
      context: ../../../notifications-service
    image: food-delivery/notifications:local
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NOTIFICATIONS_HTTP_ADDR: ":8081"
      NOTIFICATIONS_DATABASE_URL: "postgres://notifications_app@postgres:5432/notifications_db?sslmode=disable"
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?NOTIFICATIONS_DB_PASSWORD is required}
      KAFKA_BROKERS: "kafka:9092"
      ORDER_CREATED_TOPIC: "food.order-created.v1"
      ORDER_CREATED_DLQ_TOPIC: "food.order-created.dlq.v1"
      KAFKA_CONSUMER_GROUP: "notifications-v1"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate-catalog:
    image: migrate/migrate:v4.20.1
    profiles: [tools]
    environment:
      PGPASSWORD: ${CATALOG_DB_PASSWORD:?CATALOG_DB_PASSWORD is required}
    volumes:
      - ../../../catalog-service/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://catalog_app@postgres:5432/${CATALOG_MIGRATION_DB:-catalog_db}?sslmode=disable
    command: [up]

  migrate-orders:
    image: migrate/migrate:v4.20.1
    profiles: [tools]
    environment:
      PGPASSWORD: ${ORDERS_DB_PASSWORD:?ORDERS_DB_PASSWORD is required}
    volumes:
      - ../../../orders-service/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://orders_app@postgres:5432/${ORDERS_MIGRATION_DB:-orders_db}?sslmode=disable
    command: [up]

  # Применяет миграции только к базе сервиса уведомлений.
  migrate-notifications:
    image: migrate/migrate:v4.20.1
    profiles: [tools]
    environment:
      PGPASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?NOTIFICATIONS_DB_PASSWORD is required}
    volumes:
      - ../../../notifications-service/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://notifications_app@postgres:5432/${NOTIFICATIONS_MIGRATION_DB:-notifications_db}?sslmode=disable
    command: [up]

volumes:
  postgres_data:
  kafka_data:
  redis_insight_data:
  prometheus_data:
  grafana_data:
