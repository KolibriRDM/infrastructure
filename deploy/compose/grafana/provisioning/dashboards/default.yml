# Загружает dashboard проекта из JSON-файлов.
apiVersion: 1
providers:
  - name: food-delivery
    orgId: 1
    folder: Food Delivery
    folderUid: food-delivery
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
